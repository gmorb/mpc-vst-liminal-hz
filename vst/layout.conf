# SCAN / GRAINS / SNAP / SYNC tiles (see SCAN below). Here, before the painting's pictures, on purpose: the kit bakes each
# page's art (these tiles' backs, the "scan" caption) into one opaque picture cut from the background, drawn in the
# order its condition first appears. After the painting, that picture (x 630-1236, the tiles down to the caption)
# painted over columns 2-12 on the SCAN tab (test 5, 5b, 5c); first, the painting's columns draw over it.
