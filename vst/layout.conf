# AMOUNT keep their places in both (seven slots ~100 apart: the mode's own knobs on the left, PITCH and AMOUNT right).
# The SCAN / GRAINS / SNAP switches are tiles beside the tabs (sw_1..3, lit by the plugin as the tabs). Under the
