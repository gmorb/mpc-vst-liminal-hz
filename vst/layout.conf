# Liminal Hz -- MPC page (1280x628 plugin area; shadow coords = page y + 86). Browser renderer ("art": "html").
# A dark, textured page (art/texture.png under everything; frames are drawn as borders only). Left: the IR browser
# (TONE3000's design requirements: Browse TONE3000 at the block, the T3K mark, the tone's attribution). Right: the
# shaped IR as a waveform (12 columns, switched by MPC as read-only parameters change) with a playhead, and the shaping
# controls. Below: the TONE3000 strip and the mix controls. One page: the IR List and My Presets open over the browser
# (the menu parameter, below).
