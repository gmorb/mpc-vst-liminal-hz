# SHAPE / ROOM / SCAN: the knob row's three pages. The tabs are list tiles, as the keyboard's keys: a tap is one write
# and the plugin alone says which is lit (an enum_h's radio segments showed the host's value, which could disagree with
# the page shown). Each page's widgets follow its own Off/On switch (pg_shape, pg_room, pg_scan: set by the plugin,
# all Off while the keyboard is open), the two-option pattern of `kb` and the lists.
list x=572 y=100 w=264 h=30 cols=3 rows=1 th=30 gap=0 key=tabs label="Tab" img=art/tab_88.png img_on=art/tab_88_on.png talign=center tx=2 ttw=84 when=kb:0
